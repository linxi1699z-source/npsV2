<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NPS 问卷翻译</title>
    <style>
      :root { --primary:#1677ff; --primary-hover:#4096ff; --text:#1f1f1f; --secondary:#595959; --tertiary:rgba(0,0,0,.45); --border:#d9d9d9; --border-light:#f0f0f0; --fill:#fafafa; --bg:#f5f5f5; }
      * { box-sizing:border-box; } body { min-width:1180px; margin:0; color:var(--text); background:var(--bg); font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif; }
      .shell { display:flex; min-height:100vh; }.sider { width:160px; padding:28px 8px; border-right:1px solid var(--border-light); background:#fff; }.brand { margin:0 16px 28px; font-size:22px; font-weight:700; }.nav-root { height:40px; padding:10px; font-weight:600; }.nav-root::before { margin-right:4px; color:var(--secondary); content:"▾"; }.nav-item { width:100%; height:40px; padding:0 10px 0 32px; border:0; border-radius:6px; color:var(--secondary); background:transparent; font:inherit; text-align:left; cursor:pointer; }.nav-item.active { color:var(--primary); background:#e6f4ff; font-weight:600; }
      .main { flex:1; min-width:0; padding:0 28px 32px; }.breadcrumb { height:58px; padding:19px 0; border-bottom:1px solid var(--border); color:var(--secondary); }.title { margin:24px 0 20px; font-size:20px; font-weight:600; }.panel { border:1px solid var(--border-light); border-radius:6px; background:#fff; }.search { display:flex; align-items:center; gap:32px; padding:20px 24px; border-bottom:1px solid var(--border-light); }.field { display:flex; align-items:center; gap:8px; }.field label { color:var(--secondary); white-space:nowrap; }.input { width:260px; height:32px; padding:4px 11px; border:1px solid var(--border); border-radius:4px; color:var(--text); background:#fff; font:inherit; }.input:hover,.input:focus { border-color:var(--primary); outline:0; }.button { height:32px; padding:0 16px; border:1px solid var(--border); border-radius:4px; color:var(--text); background:#fff; font:inherit; cursor:pointer; }.button:hover { border-color:var(--primary-hover); color:var(--primary); }.button.primary { border-color:var(--primary); color:#fff; background:var(--primary); }.button.primary:hover { border-color:var(--primary-hover); color:#fff; background:var(--primary-hover); }
      .table-wrap { overflow:auto; }.table { width:100%; min-width:1160px; border-collapse:collapse; table-layout:fixed; }.table th,.table td { padding:12px 14px; border-bottom:1px solid var(--border-light); text-align:left; vertical-align:top; word-break:break-word; }.table th { color:var(--secondary); background:var(--fill); font-size:12px; font-weight:600; }.table th:nth-child(1){width:44px;text-align:center;}.table th:nth-child(2){width:25%;}.table th:nth-child(3),.table th:nth-child(4){width:24%;}.table th:nth-child(5){width:16%;}.table th:nth-child(6){width:8%;}.check-cell { text-align:center; }.content-cell { white-space:pre-wrap; line-height:1.6; }.key { color:var(--text); font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }.action { padding:0; border:0; color:var(--primary); background:transparent; font:inherit; white-space:nowrap; cursor:pointer; }.action:hover { color:var(--primary-hover); }.action + .action { margin-left:14px; }.pager { display:flex; align-items:center; justify-content:flex-end; gap:4px; height:44px; padding:12px 16px; border-top:1px solid var(--border-light); }.page-btn { width:27px; height:20px; border:1px solid var(--border); color:var(--secondary); background:#fff; font:inherit; line-height:18px; cursor:pointer; }.page-btn.current { color:var(--text); background:var(--fill); }.page-btn:disabled { color:rgba(0,0,0,.25); background:#fff; cursor:not-allowed; }.pager-total { margin-left:4px; color:var(--text-secondary); }
      .modal { position:fixed; z-index:10; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.45); }.modal.show { display:flex; }.dialog { display:flex; flex-direction:column; width:720px; max-height:78vh; overflow:hidden; border-radius:8px; background:#fff; box-shadow:0 6px 16px rgba(0,0,0,.16); }.dialog-head { display:flex; align-items:center; justify-content:space-between; height:56px; padding:0 24px; border-bottom:1px solid var(--border-light); font-size:16px; font-weight:600; }.close { width:32px; height:32px; border:0; border-radius:4px; color:var(--secondary); background:transparent; font-size:24px; cursor:pointer; }.dialog-body { overflow:auto; padding:20px 24px; }.meta { margin-bottom:14px; color:var(--secondary); }.meta p { margin:6px 0; }.languages { width:100%; border-collapse:collapse; }.languages th,.languages td { padding:10px 12px; border-bottom:1px solid var(--border-light); text-align:left; vertical-align:top; }.languages th { color:var(--secondary); background:var(--fill); font-size:12px; }.translation-input { width:100%; min-height:32px; padding:5px 8px; border:1px solid var(--border); border-radius:4px; font:inherit; resize:vertical; }.dialog-actions { display:flex; justify-content:flex-end; gap:8px; padding:16px 24px; border-top:1px solid var(--border-light); }.toast { position:fixed; z-index:20; top:24px; left:50%; display:none; transform:translateX(-50%); padding:10px 16px; border-radius:4px; background:#fff; box-shadow:0 3px 6px rgba(0,0,0,.12); }.toast.show { display:block; }
    </style>
    <style>
      #syncTranslations, #selectAllTranslations, .translation-select, .action.edit { display:none !important; }
    </style>
  </head>
  <body>
    <div class="shell"><aside class="sider"><div class="brand">Ringconn</div><div class="nav-root">NPS管理</div><button class="nav-item active" id="goSurveyList" type="button">问卷列表</button><button class="nav-item" id="goTaskList" type="button">投放任务</button></aside><main class="main"><div class="breadcrumb">NPS管理 / 问卷列表 / 查看所有翻译</div><section class="panel"><form class="search" id="searchForm"><div class="field"><label for="zhSearch">中文翻译</label><input class="input" id="zhSearch" type="text" placeholder="请输入中文翻译" /></div><div class="field"><label for="enSearch">英文翻译</label><input class="input" id="enSearch" type="text" placeholder="请输入英文翻译" /></div><button class="button primary" type="submit">查询</button><button class="button primary" id="syncTranslations" type="button" disabled>一键同步</button></form><div class="table-wrap"><table class="table"><thead><tr><th><input id="selectAllTranslations" type="checkbox" aria-label="全选翻译" /></th><th>Key</th><th>中文翻译</th><th>英文翻译</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="translationRows"></tbody></table></div><div class="pager"><button class="page-btn" type="button" disabled>&lt;</button><button class="page-btn current" type="button">1</button><button class="page-btn" type="button" disabled>&gt;</button><span class="pager-total" id="translationRowCount">共 0 条</span></div></section></main></div>
    <div class="modal" id="translationModal" aria-hidden="true"><section class="dialog" role="dialog" aria-modal="true"><div class="dialog-head"><span id="dialogTitle">查看翻译</span><button class="close" id="closeDialog" type="button">×</button></div><div class="dialog-body"><div class="meta" id="dialogMeta"></div><table class="languages"><thead><tr><th>语言</th><th>翻译文案</th></tr></thead><tbody id="languageRows"></tbody></table></div><div class="dialog-actions" id="dialogActions"></div></section></div><div class="modal" id="syncModal" aria-hidden="true"><section class="dialog" role="dialog" aria-modal="true"><div class="dialog-head"><span>一键同步</span></div><div class="dialog-body">确定将翻译同步到各个数据中心吗？</div><div class="dialog-actions"><button class="button" id="cancelSync" type="button">取消</button><button class="button primary" id="confirmSync" type="button">确定</button></div></section></div><div class="toast" id="toast"></div>
    <script>
      const languages=[['zh_cn','中文'],['zh_tw','繁体中文'],['en','英文'],['ja','日本语'],['de','德语'],['es','西班牙语'],['fr','法语'],['ar','阿拉伯语'],['cs','捷克语'],['tr','土耳其语'],['pl','波兰语'],['fi','芬兰语'],['it','意大利语'],['hu','匈牙利语'],['ro','罗马尼亚语'],['ko','韩语'],['lt','立陶宛语'],['ms','马来语']];
      const data=[
        {key:'nps.10010.app_display_name_1',zh:'健康体验调研问卷',en:'Health Experience Research Questionnaire',updatedAt:'2026-08-21T09:28:43Z',active:false},
        {key:'nps.10010.popup_copy_1',zh:'我们一直致力于从用户视角出发，打造更专业、更易用的健康管理体验。你的真实评价对我们至关重要。',en:'We are always working to build a more professional and intuitive health experience from the user perspective. Your honest feedback matters to us.',updatedAt:'2026-08-21T09:28:43Z',active:false},
        {key:'nps.10005.global_question.1005001.title_1',zh:'您有多大可能会向朋友或同事推荐 RingConn？',en:'How likely are you to recommend RingConn to a friend or colleague?',updatedAt:'2026-08-19T04:12:10Z',active:true},
        {key:'nps.10005.global_question.1005001.min_desc_1',zh:'不推荐',en:'Not at all likely',updatedAt:'2026-08-19T04:12:10Z',active:true},
        {key:'nps.10005.global_question.1005001.max_desc_1',zh:'非常推荐',en:'Extremely likely',updatedAt:'2026-08-19T04:12:10Z',active:true},
        {key:'nps.10003.question.1003001.title_1',zh:'睡眠监测数据准确',en:'Sleep monitoring data is accurate',updatedAt:'2026-08-18T13:45:20Z',active:true},
        {key:'nps.10003.question.1003002.title_1',zh:'活动监测数据准确',en:'Activity monitoring data is accurate',updatedAt:'2026-08-18T13:45:20Z',active:true},
        {key:'nps.10014.global_question.10014001.title_1',zh:'您有多大可能会向朋友或者同事推荐RingConn?',en:'How likely are you to recommend RingConn to a friend or colleague?',updatedAt:'2026-08-20T08:40:12Z',active:true},
        {key:'nps.10014.question.10014003.title_1',zh:'您对健康数据解读的满意度如何？',en:'How satisfied are you with the health data interpretation?',updatedAt:'2026-08-20T08:40:12Z',active:true},
        {key:'nps.10013.question.10013002.title_1',zh:'您是否愿意继续使用 RingConn 的健康服务？',en:'Would you continue using RingConn health services?',updatedAt:'2026-08-20T08:28:56Z',active:true}
      ].map((row)=>({...row,translations:Object.fromEntries(languages.map(([key,label])=>[key,key==='zh_cn'?row.zh:key==='en'?row.en:`${label} ${row.en}`]))}));
      const escape=(value)=>String(value??'').replace(/[&<>'"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
      const formatTime=(iso)=>new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(iso)).replaceAll('/','-');
      const tbody=document.getElementById('translationRows'),modal=document.getElementById('translationModal'),syncModal=document.getElementById('syncModal'),toast=document.getElementById('toast'),selectedKeys=new Set();let timer,syncTimer;
      function updateSyncButton(){document.getElementById('syncTranslations').disabled=selectedKeys.size===0;}
      function render(){const zh=document.getElementById('zhSearch').value.trim().toLowerCase(),en=document.getElementById('enSearch').value.trim().toLowerCase();const rows=data.filter((row)=>(!zh||row.zh.toLowerCase().includes(zh))&&(!en||row.en.toLowerCase().includes(en)));tbody.innerHTML=rows.length?rows.map((row)=>`<tr data-key="${escape(row.key)}"><td class="check-cell"><input class="translation-select" type="checkbox" ${selectedKeys.has(row.key)?'checked':''} aria-label="选择翻译 ${escape(row.key)}" /></td><td><code class="key">${escape(row.key)}</code></td><td class="content-cell">${escape(row.zh)}</td><td class="content-cell">${escape(row.en)}</td><td>${formatTime(row.updatedAt)}</td><td><button class="action view" type="button">查看翻译</button><button class="action edit" type="button">编辑</button></td></tr>`).join(''):'<tr><td colspan="6" style="padding:42px;text-align:center;color:rgba(0,0,0,.45)">暂无匹配数据</td></tr>';const selectAll=document.getElementById('selectAllTranslations');selectAll.checked=rows.length>0&&rows.every((row)=>selectedKeys.has(row.key));selectAll.indeterminate=rows.some((row)=>selectedKeys.has(row.key))&&!selectAll.checked;selectAll.disabled=rows.length===0;document.getElementById('translationRowCount').textContent=`共 ${rows.length} 条`;updateSyncButton();}
      function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),2400);}
      function close(){modal.classList.remove('show');modal.setAttribute('aria-hidden','true');}
      function open(row,editable){document.getElementById('dialogTitle').textContent=editable?'编辑翻译':'查看翻译';document.getElementById('dialogMeta').innerHTML=`<p><strong>多语言 Key：</strong><code class="key">${escape(row.key)}</code></p><p><strong>后台文案：</strong>${escape(row.zh)}</p>`;document.getElementById('languageRows').innerHTML=languages.map(([key,label])=>`<tr><td>${label}</td><td>${editable&&key!=='zh_cn'?`<textarea class="translation-input" data-language="${key}">${escape(row.translations[key])}</textarea>`:escape(row.translations[key])}</td></tr>`).join('');document.getElementById('dialogActions').innerHTML=editable?'<button class="button" id="cancelEdit" type="button">取消</button><button class="button primary" id="saveEdit" type="button">确定</button>':'<button class="button" id="closeView" type="button">关闭</button>';document.getElementById(editable?'cancelEdit':'closeView').addEventListener('click',close);if(editable)document.getElementById('saveEdit').addEventListener('click',()=>{document.querySelectorAll('[data-language]').forEach((input)=>row.translations[input.dataset.language]=input.value.trim());row.en=row.translations.en;row.updatedAt=new Date().toISOString();close();render();showToast('翻译已暂存，点击提交才会生效。');});modal.classList.add('show');modal.setAttribute('aria-hidden','false');}
      function closeSync(){clearTimeout(syncTimer);const button=document.getElementById('confirmSync');button.disabled=false;button.textContent='确定';syncModal.classList.remove('show');syncModal.setAttribute('aria-hidden','true');}
      document.getElementById('searchForm').addEventListener('submit',(event)=>{event.preventDefault();render();});tbody.addEventListener('change',(event)=>{const input=event.target.closest('.translation-select');if(!input)return;const key=input.closest('tr').dataset.key;if(input.checked)selectedKeys.add(key);else selectedKeys.delete(key);render();});tbody.addEventListener('click',(event)=>{const button=event.target.closest('button');if(!button)return;const row=data.find((item)=>item.key===button.closest('tr').dataset.key);open(row,button.classList.contains('edit'));});document.getElementById('selectAllTranslations').addEventListener('change',(event)=>{[...tbody.querySelectorAll('.translation-select')].forEach((input)=>{const key=input.closest('tr').dataset.key;if(event.target.checked)selectedKeys.add(key);else selectedKeys.delete(key);});render();});document.getElementById('syncTranslations').addEventListener('click',()=>{if(!selectedKeys.size){showToast('请先选择需要同步的翻译。');return;}syncModal.classList.add('show');syncModal.setAttribute('aria-hidden','false');});document.getElementById('cancelSync').addEventListener('click',closeSync);document.getElementById('confirmSync').addEventListener('click',()=>{const button=document.getElementById('confirmSync');button.disabled=true;button.textContent='同步中...';syncTimer=setTimeout(()=>{const succeeded=[...selectedKeys].every((key)=>data.find((row)=>row.key===key)?.syncState!=='failed');if(succeeded){selectedKeys.clear();closeSync();render();showToast('翻译已同步到各个数据中心。');}else{closeSync();showToast('翻译同步失败，请稍后重试。');}},850);});document.getElementById('closeDialog').addEventListener('click',close);modal.addEventListener('click',(event)=>{if(event.target===modal)close();});syncModal.addEventListener('click',(event)=>{if(event.target===syncModal)closeSync();});document.getElementById('goSurveyList').addEventListener('click',()=>location.href='./index.html#survey-list');document.getElementById('goTaskList').addEventListener('click',()=>location.href='./index.html#nps-task');render();
    </script>
    <script>
      const translationNav = document.createElement('button');
      const surveyNav = document.getElementById('goSurveyList');
      translationNav.className = 'nav-item active';
      translationNav.type = 'button';
      translationNav.textContent = 'NPS翻译';
      surveyNav.classList.remove('active');
      document.getElementById('goTaskList').insertAdjacentElement('afterend', translationNav);
      document.querySelector('.breadcrumb').textContent = 'NPS管理 / NPS翻译';
      translationNav.addEventListener('click', () => window.location.reload());
    </script>
  </body>
</html>
