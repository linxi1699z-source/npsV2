}.action-link { padding:0; border:0; color:var(--primary); background:transparent; font:inherit; white-space:nowrap; cursor:pointer; }.action-link:hover { color:var(--primary-hover); }.action-link:disabled { color:rgba(0,0,0,.25); cursor:not-allowed; }

      .upload-dialog,.translation-dialog { position:fixed; z-index:10; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.45); }.upload-dialog.show,.translation-dialog.show { display:flex; }.dialog-card { display:flex; flex-direction:column; width:720px; max-height:78vh; overflow:hidden; border-radius:8px; background:#fff; box-shadow:0 6px 16px rgba(0,0,0,.16); }.dialog-head { display:flex; align-items:center; justify-content:space-between; height:56px; padding:0 24px; border-bottom:1px solid var(--border-light); font-size:16px; font-weight:600; }.dialog-close { width:32px; height:32px; border:0; border-radius:4px; color:var(--secondary); background:transparent; font-size:24px; cursor:pointer; }.dialog-body { overflow:auto; padding:24px; }.upload-zone { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:260px; border:1px dashed #91caff; border-radius:8px; background:#f0f7ff; text-align:center; }.upload-zone.dragging { border-color:var(--primary); background:#e6f4ff; }.upload-icon { display:flex; align-items:center; justify-content:center; width:54px; height:54px; margin-bottom:16px; border-radius:50%; color:var(--primary); background:#e6f4ff; font-size:28px; }.upload-title { font-size:16px; font-weight:600; }.upload-note { margin-top:8px; color:var(--tertiary); }.selected-file { min-height:22px; margin-top:16px; color:var(--secondary); }.upload-input { display:none; }.language-table { width:100%; border-collapse:collapse; }.language-table th,.language-table td { padding:10px 12px; border-bottom:1px solid var(--border-light); text-align:left; vertical-align:top; }.language-table th { background:var(--fill-secondary); color:var(--secondary); font-size:12px; }.toast { position:fixed; z-index:20; top:24px; left:50%; display:none; transform:translateX(-50%); padding:10px 16px; border-radius:4px; background:#fff; box-shadow:0 3px 6px rgba(0,0,0,.12); }.toast.show { display:block; }

    <div class="shell">
      <aside class="sider"><div class="brand">Ringconn</div><div class="nav-root">NPS管理</div><button class="nav-item active" id="goSurveyList" type="button">问卷列表</button><button class="nav-item" id="goTaskList" type="button">投放任务</button><button class="nav-item" id="goTranslationList" type="button">NPS翻译</button></aside>

    <script>
      const params = new URLSearchParams(window.location.search);

      const requestedTemplateId = params.get("templateId");

      const templateName = params.get("templateName") || workflowCache?.templateName || "健康体验调研问卷";
      const existingKeys = params.has("existingKeys") ? params.get("existingKeys") === "1" : Boolean(workflowCache?.existingKeys);
      const languageDefinitions = [["zh_cn","中文"],["zh_tw","繁体中文"],["en","英文"],["ja","日本语"],["de","德语"],["es","西班牙语"],["fr","法语"],["ar","阿拉伯语"],["cs","捷克语"],["tr","土耳其语"],["pl","波兰语"],["fi","芬兰语"],["it","意大利语"],["hu","匈牙利语"],["ro","罗马尼亚语"],["ko","韩语"],["lt","立陶宛语"],["ms","马来语"]].map(([key,label]) => ({ key,label }));
      const fallbackRows = [{name:"问卷名称(用于 APP 展示)",value:templateName,module:"base",databaseField:"app_display_name"},{name:"弹窗文案",value:"我们一直致力于从用户视角出发，打造更专业、更易用的健康管理体验。",module:"base",databaseField:"popup_copy"},{name:"问题标题",value:"您对近期健康体验满意吗？",module:"question",questionIndex:1,questionType:"评分",questionId:`${templateId}001`,databaseField:"title"},{name:"最小值描述",value:"非常不满意",module:"question",questionIndex:1,questionType:"评分",questionId:`${templateId}001`,databaseField:"min_desc"},{name:"最大值描述",value:"非常满意",module:"question",questionIndex:1,questionType:"评分",questionId:`${templateId}001`,databaseField:"max_desc"}];
      let rows; try { rows = JSON.parse(params.get("rows") || JSON.stringify(workflowCache?.rows || [])); } catch { rows = []; }
      rows = (rows.length ? rows : fallbackRows).filter((row) => String(row.value || "").trim()).map((row,index) => ({ ...row,index,bindingKey:existingKeys ? row.bindingKey || "" : "" }));
      const candidateKeys = ["nps.10004.app_display_name_1","nps.10004.popup_copy_1","nps.10005.global_question.1005001.title_1","nps.10005.global_question.1005001.subtitle_1","nps.10005.global_question.1005001.min_desc_1","nps.10005.global_question.1005001.max_desc_1","nps.10003.question.1003001.title_1","nps.10003.question.1003001.subtitle_1","nps.10003.question.1003001.min_desc_1","nps.10003.question.1003001.max_desc_1"];
      const translations = new Map(); let uploadedFile = null; let toastTimer;
      try { Object.entries(JSON.parse(sessionStorage.getItem("nps-admin-prototype-i18n-translations-v1") || "{}")[templateId] || {}).forEach(([key,value]) => translations.set(key,value)); } catch { /* 缓存不可用时不阻断原型流程 */ }
      const keyPanel=document.getElementById("keyPanel"), uploadPanel=document.getElementById("uploadPanel"), keyTab=document.getElementById("keyTab"), uploadTab=document.getElementById("uploadTab"), toast=document.getElementById("toast");
      const showToast=(message)=>{toast.textContent=message;toast.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove("show"),2400);};
      const escapeHtml=(value)=>String(value || "").replace(/[&<>'"]/g,(char)=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[char]);
      const sectionRows=(module)=>rows.filter((row)=>row.module===module);
      const groupByQuestion=(items)=>items.reduce((groups,row)=>{const key=String(row.questionIndex||1);(groups[key] ||= []).push(row);return groups;},{});
      function sectionMarkup(title,items,isKeyStep){if(!items.length)return"";const table=(tableRows)=>`<table class="binding-table"><thead><tr><th>字段</th><th>后台文案</th><th>多语言 Key</th>${isKeyStep?"<th>操作</th>":"<th>英文翻译</th><th>操作</th>"}</tr></thead><tbody>${tableRows.map((row)=>`<tr data-row-index="${row.index}"><td>${escapeHtml(row.name)}</td><td>${escapeHtml(row.value)}</td><td>${isKeyStep?`<div class="key-combobox"><input class="key-input" data-key-input="${row.index}" value="${escapeHtml(row.bindingKey)}" placeholder="请选择Key" autocomplete="off" /><button class="key-clear${row.bindingKey ? " show" : ""}" data-key-clear="${row.index}" type="button" aria-label="清除已选Key">×</button><button class="key-combo-arrow" data-key-toggle="${row.index}" type="button" aria-label="选择Key">⌄</button><div class="key-options" data-key-options="${row.index}"></div></div>`:`<code>${escapeHtml(row.bindingKey)}</code>`}</td>${isKeyStep?`<td><button class="action-link key-view-translation" type="button">查看翻译</button></td>`:`<td>${escapeHtml(getTranslation(row,"en"))}</td><td><button class="action-link view-translation" type="button">查看翻译</button> <button class="action-link edit-translation" type="button">编辑</button></td>`}</tr>`).join("")}</tbody></table>`;const body=title==="基础信息"?table(items):Object.entries(groupByQuestion(items)).map(([index,group])=>`<div class="question-title">问题 ${index} · ${escapeHtml(group[0].questionType||"")}</div>${table(group)}`).join("");return `<section class="binding-section"><div class="binding-section-title">${title}</div>${body}</section>`;}

      const renderUploadStep=()=>{document.getElementById("translationBindingList").innerHTML=sectionMarkup("基础信息",sectionRows("base"),false)+sectionMarkup("全局问题",sectionRows("global"),false)+sectionMarkup("问卷问题",sectionRows("question"),false);};
      function generatedKey(row){if(row.module==="base")return`nps.${templateId}.${row.databaseField}_1`;const scope=row.module==="global"?"global_question":"question";const id=row.questionId||`${templateId}${String(row.questionIndex||1).padStart(3,"0")}`;return`nps.${templateId}.${scope}.${id}.${row.databaseField}_1`;}

      function setAutomaticTranslations(){rows.forEach((row)=>languageDefinitions.filter((language)=>language.key!=="zh_cn").forEach((language)=>translations.set(`${row.bindingKey}:${language.key}`,`${language.key==="en"?"English":language.label} ${row.value}`)));}
      function getMissingTranslationKey(){const targetLanguage=languageDefinitions.find((language)=>language.key!=="zh_cn");return rows.find((row)=>languageDefinitions.some((language)=>language.key!=="zh_cn"&&!getTranslation(row,language.key).trim()))?.bindingKey||targetLanguage?.key||"";}
      function persistTranslations(){try{const cached=JSON.parse(sessionStorage.getItem("nps-admin-prototype-i18n-translations-v1")||"{}");cached[templateId]=Object.fromEntries(translations);sessionStorage.setItem("nps-admin-prototype-i18n-translations-v1",JSON.stringify(cached));}catch{/* 缓存不可用时不阻断原型流程 */}}
      function escapeXml(value){return String(value||"").replace(/[<>&"']/g,(char)=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;","'":"&apos;"})[char]);}
      const write16=(bytes,value)=>bytes.push(value&255,(value>>>8)&255);
      const write32=(bytes,value)=>bytes.push(value&255,(value>>>8)&255,(value>>>16)&255,(value>>>24)&255);
      const crcTable=Array.from({length:256},(_,index)=>{let crc=index;for(let bit=0;bit<8;bit+=1)crc=crc&1?0xedb88320^(crc>>>1):crc>>>1;return crc>>>0;});
      const crc32=(bytes)=>{let crc=0xffffffff;bytes.forEach((byte)=>{crc=crcTable[(crc^byte)&255]^(crc>>>8);});return(crc^0xffffffff)>>>0;};
      function createZip(files){const encoder=new TextEncoder(),output=[],central=[];let offset=0;files.forEach((file)=>{const name=encoder.encode(file.name),content=encoder.encode(file.content),checksum=crc32(content),local=[];write32(local,0x04034b50);write16(local,20);write16(local,0);write16(local,0);write16(local,0);write16(local,0);write32(local,checksum);write32(local,content.length);write32(local,content.length);write16(local,name.length);write16(local,0);output.push(...local,...name,...content);const header=[];write32(header,0x02014b50);write16(header,20);write16(header,20);write16(header,0);write16(header,0);write16(header,0);write16(header,0);write32(header,checksum);write32(header,content.length);write32(header,content.length);write16(header,name.length);write16(header,0);write16(header,0);write16(header,0);write16(header,0);write32(header,0);write32(header,offset);central.push(...header,...name);offset=output.length;});const centralOffset=output.length;output.push(...central);const ending=[];write32(ending,0x06054b50);write16(ending,0);write16(ending,0);write16(ending,files.length);write16(ending,files.length);write32(ending,central.length);write32(ending,centralOffset);write16(ending,0);output.push(...ending);return new Blob([new Uint8Array(output)],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});}
      function downloadQuestionnaireCopy(){const exportRows=[["key","后台文案",...languageDefinitions.map((language)=>language.label)],...rows.map((row)=>[row.bindingKey,row.value,...languageDefinitions.map((language)=>getTranslation(row,language.key))])];const sheetData=exportRows.map((row,rowIndex)=>`<row r="${rowIndex+1}">${row.map((cell,cellIndex)=>`<c r="${String.fromCharCode(65+cellIndex)}${rowIndex+1}" t="inlineStr"><is><t>${escapeXml(cell)}</t></is></c>`).join("")}</row>`).join("");const worksheet=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${sheetData}</sheetData></worksheet>`;const workbook=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="问卷文案" sheetId="1" r:id="rId1"/></sheets></workbook>`;const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;const workbookRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>`;const types=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-offic       const returnToList=()=>{window.location.href="./index.html#survey-list";};
      function closeKeyOptions(){document.querySelectorAll("[data-key-options]").forEach((panel)=>panel.classList.remove("show"));}
      function renderKeyOptions(index){const input=document.querySelector(`[data-key-input="${index}"]`),panel=document.querySelector(`[data-key-options="${index}"]`);if(!input||!panel)return;const query=input.value.trim().toLowerCase();const matches=candidateKeys.filter((key)=>!query||key.toLowerCase().includes(query));panel.innerHTML=matches.length?matches.map((key)=>`<button class="key-option" data-key-value="${escapeHtml(key)}" type="button">${escapeHtml(key)}</button>`).join(""):'<div class="key-empty">暂无匹配 Key</div>';closeKeyOptions();panel.classList.add("show");}
      renderKeyStep();
      document.getElementById("keyBindingList").addEventListener("focusin",(event)=>{if(event.target.classList.contains("key-input"))renderKeyOptions(event.target.dataset.keyInput);});
      document.getElementById("keyBindingList").addEventListener("input",(event)=>{if(event.target.classList.contains("key-input")){const clear=event.target.closest(".key-combobox").querySelector(".key-clear");clear.classList.toggle("show",Boolean(event.target.value));renderKeyOptions(event.target.dataset.keyInput);}});
      document.getElementById("keyBindingList").addEventListener("click",(event)=>{const keyView=event.target.closest(".key-view-translation"),option=event.target.closest("[data-key-value]"),toggle=event.target.closest("[data-key-toggle]"),clear=event.target.closest("[data-key-clear]");if(keyView){const row=rows[Number(keyView.closest("tr[data-row-index]").dataset.rowIndex)];openTranslationDialog(row,false);return;}if(option){const box=option.closest(".key-combobox"),input=box.querySelector(".key-input");input.value=option.dataset.keyValue;box.querySelector(".key-clear").classList.add("show");closeKeyOptions();return;}if(clear){const box=clear.closest(".key-combobox"),input=box.querySelector(".key-input");input.value="";clear.classList.remove("show");input.focus();renderKeyOptions(clear.dataset.keyClear);return;}if(toggle){renderKeyOptions(toggle.dataset.keyToggle);}});
      document.addEventListener("click",(event)=>{if(!document.getElementById("keyBindingList").contains(event.target))closeKeyOptions();});
      function persistBoundKeys(){try{const cacheKey="nps-admin-prototype-session-v1",cache=JSON.parse(sessionStorage.getItem(cacheKey)||"{}");const template=(cache.templates||[]).find((item)=>String(item.template_id)===String(templateId));if(!template)return;template.i18n_bound_keys=Object.fromEntries(rows.filter((row)=>row.key&&row.bindingKey).map((row)=>[row.key,row.bindingKey]));sessionStorage.setItem(cacheKey,JSON.stringify(cache));}catch{/* 缓存不可用时不阻断原型流程 */}}
      document.getElementById("submitKeys").addEventListener("click",()=>{document.querySelectorAll("[data-key-input]").forEach((input)=>{rows[Number(input.dataset.keyInput)].bindingKey=input.value.trim();});if(rows.some((row)=>row.bindingKey.toLowerCase().includes("error"))){showToast("提交失败，请稍后重试");return;}const button=document.getElementById("submitKeys");button.disabled=true;button.textContent="提交中...";setTimeout(()=>{rows.forEach((row)=>{if(!row.bindingKey)row.bindingKey=generatedKey(row);});persistBoundKeys();button.disabled=false;button.textContent="提交 Key";showToast("Key已保存。");switchToUpload();},700);});
      document.getElementById("cancelKey").addEventListener("click",returnToList);document.getElementById("goSurveyList").addEventListener("click",returnToList);document.getElementById("goTaskList").addEventListener("click",()=>{window.location.href="./index.html#nps-task";});document.getElementById("goTranslationList").addEventListener("click",()=>{window.location.href="./translation-query.html?v=20260903-06";});
      const uploadDialog=document.getElementById("uploadDialog"),translationDialog=document.getElementById("translationDialog"),uploadFile=document.getElementById("uploadFile");
      const closeUploadDialog=()=>{uploadDialog.classList.remove("show");uploadDialog.setAttribute("aria-hidden","true");};
      function openUploadDialog(){uploadFile.value="";uploadedFile=null;document.getElementById("selectedUploadFile").textContent="未选择文件";uploadDialog.classList.add("show");uploadDialog.setAttribute("aria-hidden","false");}
      function setFile(file){if(!file)return;if(!file.name.toLowerCase().endsWith(".xlsx")){showToast("仅支持上传 XLSX 文件。");return;}if(file.size>5*1024*1024){showToast("文件大小不能超过 5 M。");return;}uploadedFile=file;document.getElementById("selectedUploadFile").textContent=`已选择：${file.name}`;}
      document.getElementById("uploadTranslation").addEventListener("click",openUploadDialog);document.getElementById("chooseUploadFile").addEventListener("click",()=>uploadFile.click());uploadFile.addEventListener("change",()=>setFile(uploadFile.files[0]));
      document.getElementById("downloadQuestionnaireCopy").addEventListener("click",downloadQuestionnaireCopy);
      const uploadZone=document.getElementById("uploadZone");["dragenter","dragover"].forEach((name)=>uploadZone.addEventListener(name,(event)=>{event.preventDefault();uploadZone.classList.add("dragging");}));["dragleave","drop"].forEach((name)=>uploadZone.addEventListener(name,(event)=>{event.preventDefault();uploadZone.classList.remove("dragging");}));uploadZone.addEventListener("drop",(event)=>setFile(event.dataTransfer.files[0]));document.querySelectorAll("[data-close-upload]").forEach((button)=>button.addEventListener("click",closeUploadDialog));
      document.getElementById("confirmUpload").addEventListener("click",()=>{if(!uploadedFile){showToast("请先上传翻译文案。");return;}const button=document.getElementById("confirmUpload");button.disabled=true;button.textContent="处理中...";setTimeout(()=>{setAutomaticTranslations();document.getElementById("translationFileName").textContent=`已上传：${uploadedFile.name}`;button.disabled=false;button.textContent="确认";closeUploadDialog();renderUploadStep();showToast("翻译已暂存，点击提交才会生效。");},700);});
      document.getElementById("translationBindingList").addEventListener("click",(event)=>{const button=event.target.closest("button"),element=event.target.closest("tr[data-row-index]");if(!button||!element)return;const row=rows[Number(element.dataset.rowIndex)];if(button.classList.contains("view-translation"))openTranslationDialog(row,false);if(button.classList.contains("edit-translation"))openTranslationDialog(row,true);});
      const closeTranslationDialog=()=>{translationDialog.classList.remove("show");translationDialog.setAttribute("aria-hidden","true");};
      function openTranslationDialog(row,editable){document.getElementById("translationDialogTitle").textContent=editable?"编辑翻译":"查看翻译";document.getElementById("translationDialogMeta").innerHTML=`<p><strong>多语言 Key：</strong><code>${escapeHtml(row.bindingKey)}</code></p><p><strong>后台文案：</strong>${escapeHtml(row.value)}</p>`;const table=document.getElementById("translationRows");table.innerHTML=languageDefinitions.map((language)=>`<tr><td>${language.label}</td><td>${editable&&language.key!=="zh_cn"?`<input class="translation-input" data-language="${language.key}" value="${escapeHtml(getTranslation(row,language.key))}" />`:escapeHtml(getTranslation(row,language.key))}</td></tr>`).join("");const actions=document.getElementById("translationDialogActions");actions.innerHTML=`<button class="button" id="cancelTranslationDialog" type="button">${editable?"取消":"关闭"}</button>${editable?'<button class="button primary" id="saveTranslationDialog" type="button">确定</button>':""}`;document.getElementById("cancelTranslationDialog").addEventListener("click",closeTranslationDialog);if(editable)document.getElementById("saveTranslationDialog").addEventListener("click",()=>{const inputs=[...table.querySelectorAll("[data-language]")];if(inputs.some((input)=>!input.value.trim())){showToast("翻译有空值，请补充全部翻译。");return;}inputs.forEach((input)=>translations.set(`${row.bindingKey}:${input.dataset.language}`,input.value.trim()));renderUploadStep();closeTranslationDialog();showToast("翻译已暂存，点击提交才会生效。");});translationDialog.classList.add("show");translationDialog.setAttribute("aria-hidden","false");}
      document.querySelectorAll("[data-close-translation]").forEach((button)=>button.addEventListener("click",closeTranslationDialog));document.getElementById("submitTranslations").addEventListener("click",()=>{const missingKey=getMissingTranslationKey();if(missingKey){showToast(`${missingKey}翻译有空值，请补充全部翻译。`);return;}persistTranslations();showToast("多语言 Key 和翻译已提交。");setTimeout(()=>{window.location.href=`./index.html?i18nSaved=${encodeURIComponent(templateId)}#survey-list`;},650);});document.getElementById("cancelTranslations").addEventListener("click",returnToList);
    </script>
  </body>
</html>
